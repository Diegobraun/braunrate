# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
nome: Cobranca via GraphQL
alvo: ${ALVO:-http://127.0.0.1:8080}

autenticacao:
  tipo: token
  obter:
    http: { metodo: POST, caminho: /auth/token, corpo: { usuario: ana, senha: "${SENHA:-segredo}" } }
    captura: { token: $.access_token }

dados:
  assinantes:
    arquivo: dados/assinantes.csv
    consumo: circular

carga:
  perfis:
    - rampa: { de: 50/s, ate: 200/s, durante: 5s }
    - patamar: { taxa: 200/s, durante: 5s }

cenario:
  - graphql:
      consulta: |
        query ConsultarPedido($id: ID!) {
          pedido(id: $id) {
            id
            status
            ultimaFatura { id valor status }
          }
        }
      variaveis: { id: "${assinantes.id}" }
    verificar:
      json: { $.data.pedido.status: ABERTO }
    captura:
      faturaId: $.data.pedido.ultimaFatura.id

  - graphql:
      consulta: |
        mutation PagarFatura($fatura: ID!) {
          pagarFatura(id: $fatura) { id status pagoEm }
        }
      variaveis: { fatura: "${faturaId}" }
    verificar:
      json: { $.data.pagarFatura.status: PAGA }

slo:
  - graphql ConsultarPedido: { p95: < 150ms }
  - graphql PagarFatura: { p95: < 200ms }
  - global: { erros: < 0.1 }
