name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A release chama este mesmo workflow em vez de repetir os passos: o portao
  # que decide se publica precisa ser o portao de sempre, nao uma copia dele
  # que envelhece sozinha.
  workflow_call:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      kafka:
        image: apache/kafka:3.8.0
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true' 
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: formatacao
        run: |
          arquivos=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$arquivos" ]; then
            echo "arquivos fora do gofmt:"
            echo "$arquivos"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./... --timeout 5m

      - name: build
        run: go build ./...

      - name: testes
        run: go test ./... -count=1

      - name: testes de mensageria contra brokers reais
        env:
          BRAUNRATE_KAFKA: 127.0.0.1:9092
          BRAUNRATE_AMQP: amqp://guest:guest@127.0.0.1:5672/
        run: go test ./internal/messaging/... ./internal/testsupport/... -count=1 -v -timeout 5m

      - name: broker que exige credencial de verdade
        run: |
          chmod +x .github/broker-autenticado.sh
          .github/broker-autenticado.sh /tmp/certificados-ci

      - name: testes contra o broker autenticado
        env:
          BRAUNRATE_KAFKA_TLS: localhost:9095
          BRAUNRATE_KAFKA_USER: ana
          BRAUNRATE_KAFKA_PASSWORD: segredo-do-ci
          BRAUNRATE_KAFKA_CA: /tmp/certificados-ci/ca.pem
        run: go test ./internal/messaging/... -count=1 -v -timeout 5m

      - name: teste de auto-validacao de medicao
        run: go test ./internal/selfcheck/... -count=1 -v

      # O site e gerado dos guias do proprio repositorio. Gerar aqui, no portao,
      # e o que garante que um guia quebrado reprova o commit em vez de reprovar
      # a publicacao depois que o commit ja entrou.
      - name: o site de documentacao gera
        run: go run ./cmd/site -out site

      - name: exemplo publicado esta atualizado
        run: |
          go build -o braunrate ./cmd/braunrate
          ./braunrate report docs/exemplo-resultado.json -html=docs/exemplo-relatorio.html
          if ! git diff --quiet -- docs/exemplo-relatorio.html; then
            echo "docs/exemplo-relatorio.html esta desatualizado; regenere com:"
            echo "  go run ./cmd/braunrate report docs/exemplo-resultado.json -html=docs/exemplo-relatorio.html"
            git --no-pager diff --stat -- docs/exemplo-relatorio.html
            exit 1
          fi

      - name: todos os exemplos publicados rodam
        env:
          BRAUNRATE_KAFKA: 127.0.0.1:9092
        run: |
          ./braunrate target -address=127.0.0.1:8080 -latency=5ms \
            -kafka=127.0.0.1:9092 -input=orders-chain -output=orders-processed &
          sleep 3
          chmod +x .github/executar-exemplos.sh
          .github/executar-exemplos.sh
