name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A release chama este mesmo workflow em vez de repetir os passos: o portao
  # que decide se publica precisa ser o portao de sempre, nao uma copia dele
  # que envelhece sozinha.
  workflow_call:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      kafka:
        image: apache/kafka:3.8.0
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true' 
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Um portao so, chamado daqui e pela pessoa antes de empurrar. Duas listas
      # de passos divergem sozinhas, e foi assim que o CI ficou vermelho oito
      # commits enquanto 'go test ./...' passava na maquina.
      - name: gate
        env:
          BRAUNRATE_KAFKA: 127.0.0.1:9092
          BRAUNRATE_AMQP: amqp://guest:guest@127.0.0.1:5672/
        run: |
          chmod +x portao.sh
          ./portao.sh
