name: release

# So por tag. Nenhuma publicacao sai de um push em main: quem decide que uma
# arvore virou release e uma pessoa criando a tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A suite completa, o lint e os exemplos, exatamente como em qualquer commit.
  # Se este job reprovar, nada e publicado.
  portao:
    uses: ./.github/workflows/ci.yml

  # A release nasce em rascunho. Rascunho nao aparece na pagina de releases e
  # nao tem URL de download publica: enquanto a conferencia nao passar, nao ha
  # arquivo que alguem possa baixar.
  publicar-rascunho:
    needs: portao
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # O goreleaser monta o changelog a partir do historico entre as tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          # O --draft repete o que o .goreleaser.yaml ja diz, de proposito.
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # O binario e baixado do rascunho, conferido pelo checksum e executado. Sem
  # este job, "funciona" seria uma suposicao sobre um artefato que ninguem
  # abriu — e a suposicao ja esteve errada uma vez, quando o empacotamento
  # deixou de fora todos os cenarios da raiz de examples/.
  conferir-o-rascunho:
    needs: publicar-rascunho
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artefato: linux_amd64
            extensao: tar.gz
          - runner: macos-14
            artefato: darwin_arm64
            extensao: tar.gz
          - runner: windows-latest
            artefato: windows_amd64
            extensao: zip
    runs-on: ${{ matrix.runner }}
    permissions:
      # Rascunho so e listado para quem tem acesso de escrita. Com
      # contents: read a listagem volta vazia, o job falha, e a mensagem nao
      # tem nada a ver com a causa — conferido em repositorio descartavel.
      contents: write
    steps:
      # A garantia deste desenho em uma linha: enquanto a conferencia nao
      # passar, nao existe release publicada com esta tag. A API de release por
      # tag nao devolve rascunho, entao ela responder 200 aqui seria o furo.
      - name: nao existe release publicada com esta tag ainda
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "a release ${GITHUB_REF_NAME} ja esta publicada antes da conferencia"
            exit 1
          fi
          echo "confirmado: nenhuma release publicada com a tag ${GITHUB_REF_NAME}"

      # Rascunho nao tem URL de download publica e nem aparece na API por tag:
      # 'gh release download <tag>' responde "release not found". O caminho e
      # achar a release pelo id na listagem e baixar cada arquivo pelo id dele.
      - name: baixar do rascunho e conferir o checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#v}"
          arquivo="braunrate_${versao}_${{ matrix.artefato }}.${{ matrix.extensao }}"
          rascunho=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"${GITHUB_REF_NAME}\")][0].id")
          if [ -z "$rascunho" ] || [ "$rascunho" = "null" ]; then
            echo "nao achei rascunho para a tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          for nome in "$arquivo" checksums.txt; do
            asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${rascunho}/assets" \
              --jq ".[] | select(.name==\"${nome}\") | .id")
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" > "$nome"
          done
          grep " $arquivo\$" checksums.txt > checksum-deste.txt
          # macOS nao tem sha256sum e Linux nao tem shasum garantido.
          if command -v sha256sum > /dev/null; then
            sha256sum -c checksum-deste.txt
          else
            shasum -a 256 -c checksum-deste.txt
          fi

      - name: descompactar
        shell: bash
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#v}"
          arquivo="braunrate_${versao}_${{ matrix.artefato }}.${{ matrix.extensao }}"
          if [ "${{ matrix.extensao }}" = "zip" ]; then
            powershell -Command "Expand-Archive -Path '$arquivo' -DestinationPath . -Force"
          else
            tar xzf "$arquivo"
          fi

      - name: o binario se identifica com a tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.extensao }}" = "zip" ]; then binario=./braunrate.exe; else binario=./braunrate; fi
          "$binario" version
          "$binario" version | grep -q "braunrate ${GITHUB_REF_NAME#v}"

      - name: o binario mede de verdade
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.extensao }}" = "zip" ]; then binario=./braunrate.exe; else binario=./braunrate; fi
          "$binario" target -address=127.0.0.1:8080 -latency=5ms &
          sleep 3
          "$binario" validate examples/http-basic.yaml
          "$binario" execute examples/ci.yaml -quiet -result resultado.json
          # A versao viaja dentro do documento de resultado, e e por ela que a
          # comparacao entre duas execucoes decide se tem veredito.
          grep -q "\"version\": \"${GITHUB_REF_NAME#v}\"" resultado.json

  # So aqui a release deixa de ser rascunho. O que o usuario baixa da pagina de
  # releases e, sempre, um artefato que ja foi baixado e executado.
  promover:
    needs: conferir-o-rascunho
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publicar a release conferida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName

  # Conferencia reprovada descarta o rascunho: ninguem viu, e o mesmo tag pode
  # ser disparado de novo sem colidir com uma release ja existente. A tag em si
  # nao e apagada — apaga-la e decisao de pessoa, nao de workflow.
  descartar-o-rascunho:
    needs: [publicar-rascunho, conferir-o-rascunho]
    if: failure() && needs.publicar-rascunho.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: apagar a release em rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "a conferencia reprovou; o rascunho $GITHUB_REF_NAME vai ser descartado"
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
