# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
#
# Não existe passo condicional, e não é falta: o caminho de cada perfil e a
# proporção entre eles são conhecimento de negócio, e nenhuma observação de
# tráfego revela isso. Quem grava uma passagem grava um perfil.
#
# A ramificação honesta é por dado: a coluna decide a rota, e o CSV declara a
# proporção. Aqui são dois terços pessoa física para um terço pessoa jurídica,
# porque foi assim que as linhas foram escritas.
name: Ramificação por perfil de cliente
target: ${ALVO:-http://127.0.0.1:8080}

data:
  clientes:
    file: dados/clientes.csv
    consume: circular

load:
  profiles:
    - steady: { rate: 50/s, duration: 5s }

scenario:
  - name: consultar limite
    http:
      method: GET
      path: /${clientes.rota}/${clientes.id}/limite
    expect:
      status: 200
      # Prova que a rota veio do dado: o alvo embutido devolve o caminho que
      # recebeu. Sem isso, uma coluna vazia interpolaria e a execução passaria
      # medindo outra rota.
      json: { $.caminho: "/${clientes.rota}/${clientes.id}/limite" }

slo:
  - consultar limite: { p95: < 200ms }
  - global: { errors: < 1 }

# O que esta linha única esconde: se pessoa jurídica for mais cara que pessoa
# física, o p95 do passo é o p95 da população cara usando o nome do passo
# inteiro, e quem lê procura cauda onde há duas populações. O bloco de variedade
# observada do relatório mostra que ${clientes.rota} teve dois valores; ligar as
# duas coisas ainda não existe, e está na lista para a sessão com o QA.
