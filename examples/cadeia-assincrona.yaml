# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Cadeia assíncrona de cobrança
target: ${BROKERS:-127.0.0.1:9092}

# Sem broker este cenário não roda. Declarado aqui para quem for executar e para
# o laço de exemplos do CI, que pula com aviso em vez de quebrar em silêncio.
requires: [kafka]

data:
  pedidos:
    generate:
      id: uuid
      valor: number(10,500)

load:
  profiles:
    # O processador do alvo embutido leva 20ms por mensagem, então aguenta 50/s.
    # Pedir mais que isso enfileira, e a jornada cresce sem o alvo estar lento.
    - ramp: { from: 10/s, to: 40/s, duration: 5s }
    - steady: { rate: 40/s, duration: 5s }

scenario:
  - kafka:
      topic: pedidos-cadeia
      key: "${pedidos.id}"
      value: { pedido: "${pedidos.id}", valor: "${pedidos.valor}" }

  - await:
      kafka: { topic: pedidos-processados }
      key: "${pedidos.id}"
      timeout: 10s

slo:
  - kafka produzir pedidos-cadeia: { p95: < 100ms }
  - await pedidos-processados: { p95: < 2s }
  - global: { errors: < 1 }
