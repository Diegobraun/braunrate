# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Cobrança via GraphQL
target: ${ALVO:-http://127.0.0.1:8080}

auth:
  type: token
  obtain:
    http: { method: POST, path: /auth/token, body: { usuario: ana, senha: "${SENHA:-segredo}" } }
    capture: { token: $.access_token }

data:
  assinantes:
    file: dados/assinantes.csv
    consume: circular

load:
  profiles:
    - ramp: { from: 50/s, to: 200/s, duration: 5s }
    - steady: { rate: 200/s, duration: 5s }

scenario:
  - graphql:
      query: |
        query ConsultarPedido($id: ID!) {
          pedido(id: $id) {
            id
            status
            ultimaFatura { id valor status }
          }
        }
      variables: { id: "${assinantes.id}" }
    expect:
      json: { $.data.pedido.status: ABERTO }
    capture:
      faturaId: $.data.pedido.ultimaFatura.id

  - graphql:
      query: |
        mutation PagarFatura($fatura: ID!) {
          pagarFatura(id: $fatura) { id status pagoEm }
        }
      variables: { fatura: "${faturaId}" }
    expect:
      json: { $.data.pagarFatura.status: PAGA }

slo:
  - graphql ConsultarPedido: { p95: < 150ms }
  - graphql PagarFatura: { p95: < 200ms }
  - global: { errors: < 0.1 }
