# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Jornada de cobrança
target: http://127.0.0.1:8080

variables:
  usuario: ${USUARIO:-ana}

auth:
  type: token
  obtain:
    http:
      method: POST
      path: /auth/token
      body: { usuario: "${usuario}", senha: "${SENHA:-segredo}" }
    capture: { token: $.access_token }
  refreshAfter: 25m

data:
  assinantes:
    file: dados/assinantes.csv
    consume: circular

load:
  profiles:
    - ramp: { from: 50/s, to: 300/s, duration: 5s }
    - steady: { rate: 300/s, duration: 5s }

scenario:
  - http: GET /pedidos/${assinantes.id}
    name: consultar pedido
    expect:
      status: 200
      json: { $.ultimaFatura.status: ABERTA }
    capture:
      faturaId: $.ultimaFatura.id

  - name: pagar fatura
    http:
      method: POST
      path: /faturas/${faturaId}/pagar
      body: { valor: 199.90 }
    expect:
      status: 200
      json: { $.status: PAGA }

slo:
  - consultar pedido: { p95: < 150ms }
  - pagar fatura: { p95: < 200ms }
  - journey: { p95: < 2s, p99: < 5s }
  - global: { errors: < 0.1 }
