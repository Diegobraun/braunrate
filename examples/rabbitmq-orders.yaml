# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Order events over RabbitMQ
target: ${BRAUNRATE_AMQP:-amqp://guest:guest@127.0.0.1:5672/}

# Without a RabbitMQ broker this scenario does not run. Declared here for whoever
# runs it and for the CI loop over the examples, which skips with a warning
# instead of breaking in silence.
requires: [amqp]

data:
  orders:
    generate:
      id: uuid
      amount: number(10,500)

load:
  profiles:
    - steady: { rate: 40/s, duration: 5s }

scenario:
  - amqp:
      queue: orders-events
      body: { order: "${orders.id}", amount: "${orders.amount}" }

slo:
  # 250ms, not 100: the confirm round-trip on a shared CI runner sat at 120-150ms
  # and flaked the gate. The looser bound still catches a real regression.
  - amqp publish orders-events: { p95: < 250ms }
  - global: { errors: < 1 }
