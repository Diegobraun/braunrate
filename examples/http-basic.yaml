# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Order lookup
target: http://127.0.0.1:8080

variables:
  tenant: ${TENANT:-acme}

# The built-in target asks for a token, the way a real API would. Without this
# block the whole run takes 401 and comes out invalid.
auth:
  type: token
  obtain:
    http: { method: POST, path: /auth/token, body: { user: ana, password: "${PASSWORD:-secret}" } }
    capture: { token: $.access_token }

load:
  profiles:
    - ramp: { from: 100/s, to: 800/s, duration: 5s }
    - steady: { rate: 800/s, duration: 10s }
    - spike: { rate: 2000/s, duration: 3s }

scenario:
  - http: GET /orders/${tenant}
    name: look up order
    expect: { status: 200 }

  - name: create order
    http:
      method: POST
      path: /orders
      headers: { X-Tenant: "${tenant}" }
      body: { amount: 199.90, description: "monthly subscription" }
    expect: { status: 201 }
