# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
#
# Repetir a mesma chamada mede cache, não sistema. Aqui cada iteração executa uma
# das três alternativas, na proporção declarada: a taxa continua sendo a do bloco
# 'carga', e o peso decide como ela se reparte.
#
# A escolha é por posição no ciclo, não sorteio: duas execuções do mesmo arquivo
# aplicam o mesmo mix, então a diferença entre elas é do alvo (ADR 0016).
name: Mix de operações
target: ${ALVO:-http://127.0.0.1:8080}

auth:
  type: token
  obtain:
    http: { method: POST, path: /auth/token, body: { usuario: ana, senha: "${SENHA:-segredo}" } }
    capture: { token: $.access_token }

data:
  pedidos:
    file: dados/assinantes.csv
    consume: circular

load:
  profiles:
    - steady: { rate: 100/s, duration: 5s }

scenario:
  - name: consultar pedido
    weight: 60
    http: { method: GET, path: "/pedidos/${pedidos.id}" }
    expect: { status: 200 }

  - name: consultar fatura
    weight: 30
    http: { method: GET, path: "/pedidos/${pedidos.id}/fatura" }
    expect: { status: 200 }

  - name: criar pedido
    weight: 10
    http: { method: POST, path: /pedidos, body: { assinante: "${pedidos.id}" } }
    expect: { status: 201 }

slo:
  - consultar pedido: { p95: < 200ms }
  - consultar fatura: { p95: < 200ms }
  - criar pedido: { p95: < 300ms }
  - global: { errors: < 1 }

# Não existe passo com captura aqui, e não é por acaso: peso escolhe qual
# alternativa executar, não qual passo dentro de uma jornada. Um cenário com
# cadeia de capturas é uma jornada só, e a validação recusa peso nele.
