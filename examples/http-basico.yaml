# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Consulta de pedidos
target: http://127.0.0.1:8080

variables:
  tenant: ${TENANT:-acme}

# O alvo embutido exige token, como uma API de verdade. Sem este bloco a
# execução inteira toma 401 e sai inválida.
auth:
  type: token
  obtain:
    http: { method: POST, path: /auth/token, body: { usuario: ana, senha: "${SENHA:-segredo}" } }
    capture: { token: $.access_token }

load:
  profiles:
    - ramp: { from: 100/s, to: 800/s, duration: 5s }
    - steady: { rate: 800/s, duration: 10s }
    - spike: { rate: 2000/s, duration: 3s }

scenario:
  - http: GET /pedidos/${tenant}
    name: consultar pedido
    expect: { status: 200 }

  - name: criar pedido
    http:
      method: POST
      path: /pedidos
      headers: { X-Tenant: "${tenant}" }
      body: { valor: 199.90, descricao: "assinatura mensal" }
    expect: { status: 201 }
