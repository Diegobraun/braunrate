# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Billing journey
target: http://127.0.0.1:8080

variables:
  user: ${USER_NAME:-ana}

auth:
  type: token
  obtain:
    http:
      method: POST
      path: /auth/token
      body: { user: "${user}", password: "${PASSWORD:-secret}" }
    capture: { token: $.access_token }
  refreshAfter: 25m

data:
  subscribers:
    file: data/subscribers.csv
    consume: circular

load:
  profiles:
    - ramp: { from: 50/s, to: 300/s, duration: 5s }
    - steady: { rate: 300/s, duration: 5s }

scenario:
  - http: GET /orders/${subscribers.id}
    name: look up order
    expect:
      status: 200
      json: { $.lastInvoice.status: OPEN }
    capture:
      invoiceId: $.lastInvoice.id

  - name: pay invoice
    http:
      method: POST
      path: /invoices/${invoiceId}/pay
      body: { amount: 199.90 }
    expect:
      status: 200
      json: { $.status: PAID }

slo:
  - look up order: { p95: < 150ms }
  - pay invoice: { p95: < 200ms }
  - journey: { p95: < 2s, p99: < 5s }
  - global: { errors: < 0.1 }
