# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: Fumaça de CI
target: http://127.0.0.1:8080

auth:
  type: token
  obtain:
    http: { method: POST, path: /auth/token, body: { usuario: ci } }
    capture: { token: $.access_token }

load:
  profiles:
    - ramp: { from: 50/s, to: 200/s, duration: 3s }
    - steady: { rate: 200/s, duration: 3s }

scenario:
  # Caminho fixo de propósito: a fumaça só pergunta se o serviço responde. A
  # ferramenta avisa que o número fica otimista, e aqui isso está certo: para
  # medir tempo de resposta de verdade, o caminho precisa variar.
  - http: GET /pedidos/1
    name: consultar pedido
    expect: { status: 200 }

slo:
  - global: { errors: < 0.1 }
