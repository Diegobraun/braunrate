# yaml-language-server: $schema=https://raw.githubusercontent.com/Diegobraun/braunrate/main/docs/braunrate.schema.json
name: CI smoke
target: http://127.0.0.1:8080

auth:
  type: token
  obtain:
    http: { method: POST, path: /auth/token, body: { user: ci } }
    capture: { token: $.access_token }

load:
  profiles:
    - ramp: { from: 50/s, to: 200/s, duration: 3s }
    - steady: { rate: 200/s, duration: 3s }

scenario:
  # Fixed path on purpose: the smoke test only asks whether the service answers.
  # The tool warns that the number comes out optimistic, and here that is right:
  # to measure real response time, the path has to vary.
  - http: GET /orders/1
    name: look up order
    expect: { status: 200 }

slo:
  - global: { errors: < 0.1 }
